<text x="792" y="614" text-anchor="start" font-size="12" fill="#111" font-weight="normal">GND (black/brown)</text>
<rect x="60" y="660" width="980" height="125" rx="10" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<text x="76" y="684" text-anchor="start" font-size="13" fill="#111" font-weight="bold">POWER NOTES  (tags with the same name are the same net - use the breadboard rails)</text>
<text x="76" y="705" text-anchor="start" font-size="13" fill="#111" font-weight="normal">+5V (red)  : external 5 V supply, 2 A or more -> both ULN2003 boards and the servo V+. Do NOT connect it to the ESP32 5V/USB pin.</text>
<text x="76" y="726" text-anchor="start" font-size="13" fill="#111" font-weight="normal">VM (orange): motor supply for the Easy Driver M+ (6-12 V typical, match your motor). Put a 100 uF capacitor across M+ and GND.</text>
<text x="76" y="747" text-anchor="start" font-size="13" fill="#111" font-weight="normal">GND (black): ONE common ground: ESP32 GND, both ULN2003 boards, Easy Driver, servo, and the negative of every supply.</text>
<text x="76" y="768" text-anchor="start" font-size="13" fill="#111" font-weight="normal">The ESP32 itself runs from USB. Wire coil pairs on the Easy Driver so each pair is one motor winding (see README).</text>
</svg>